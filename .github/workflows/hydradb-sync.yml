name: Sync repository to HydraDB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The app and its sync script live in rrflow-app/ inside the single workspace repository.
defaults:
  run:
    working-directory: rrflow-app

# Finish each checkpoint before the next run; never race writes or cancel midway.
concurrency:
  group: hydradb-repository-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'EonsofStupid/rrflow-hydradb'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Sync committed sources, verify indexing, and report to Raindrop
        run: node scripts/github-sync.mjs
        env:
          HYDRA_DB_API_KEY: ${{ secrets.HYDRA_DB_API_KEY }}
          RAINDROP_WRITE_KEY: ${{ secrets.RAINDROP_WRITE_KEY }}
